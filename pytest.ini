[pytest]
testpaths = tests
pythonpath = .
base_url = https://restful-booker.herokuapp.com
# -ra: resumen final de lo que no pasó · --strict-markers: error si un marcador no está declarado
addopts = -ra --strict-markers
markers =
    smoke: comprobaciones rápidas de que la API responde
    regresion: suite completa de funcionalidades
