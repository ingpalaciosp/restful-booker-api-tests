name: Tests de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # No hace falta instalar navegadores: las pruebas de API no abren ninguno.

      - name: Revisar estilo del código
        run: |
          ruff check .
          ruff format --check .

      - name: Ejecutar los tests
        run: pytest -v --html=informe.html --self-contained-html

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: informe.html
